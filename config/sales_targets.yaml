# ============================================================================
# CONFIGURATION NOTES
# ============================================================================

# FISCAL CALENDAR:
# - Defines when your fiscal year starts (fy_start: "MM-DD")
# - Currently: Feb 1 (standard for Salesforce Southern Europe region)
# - Quarter months use calendar month numbers (1-12)
# - Q4 end_month is 1 (January) because it spans the year boundary (Nov-Jan)
# - Changes here affect all period calculations across all tools
# - Example: If FY starts on April 1, set fy_start: "04-01" and update quarters accordingly
#
# REVENUE TARGETS:
# - All amounts in EUR (or local currency — specify in your Salesforce org)
# - Fiscal year labels: fy27, fy26, fy25, etc.
# - Current fiscal year: FY27 (Feb 2026 - Jan 2027)
# - When querying targets:
#   1. Check if partner + country combination exists
#   2. Fall back to partner global target
#   3. Fall back to territory/country target
#   4. Fall back to partner default (100,000)
#
# - Territory structure allows flexibility:
#   - Use territory-wide target if country breakdown isn't available
#   - Add country-specific targets as needed
#   - Mix granularity (some countries detailed, others use territory fallback)

# Example queries:
# - get_revenue("THIS_QUARTER", territory="South_Europe")
#   → Uses South_Europe main target (2,000,000 FY27) if no country filter
# - get_revenue("THIS_QUARTER", territory="South_Europe", country="Spain")
#   → Uses Spain-specific target (700,000 FY27)
# - get_revenue("THIS_QUARTER", partner="Accenture")
#   → Uses Accenture global target (900,000 FY27)
# - get_revenue("THIS_QUARTER", partner="Accenture", country="Spain")
#   → Uses Accenture Spain target (400,000 FY27)
# - get_revenue("THIS_QUARTER", partner="UnknownPartner")
#   → Uses default (100,000 FY27)


