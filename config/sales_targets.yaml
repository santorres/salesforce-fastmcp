# Sales Targets & Fiscal Calendar Configuration
# This file defines:
# 1. Revenue targets at territory, country, and partner levels
# 2. Fiscal calendar (quarter definitions)
#
# TARGET HIERARCHY:
# 1. Specific partner + country → Partner target for that country
# 2. Partner (global) → Partner target across all countries
# 3. Country-specific → Country target within territory
# 4. Territory → Territory-wide fallback target
# 5. Default → 100,000 per partner/year if none specified

# ============================================================================
# FISCAL CALENDAR (quarter definitions)
# ============================================================================

fiscal_calendar:
  # Fiscal year starts on this date (month-day)
  fy_start: "02-01"  # February 1st

  # Quarter definitions (month ranges inclusive)
  quarters:
    Q1:
      start_month: 2    # February
      end_month: 4      # April

    Q2:
      start_month: 5    # May
      end_month: 7      # July

    Q3:
      start_month: 8    # August
      end_month: 10     # October

    Q4:
      start_month: 11   # November
      end_month: 1      # January (next year)

# ============================================================================
# TERRITORIES (regional groupings with multi-level targets)
# ============================================================================

territories:
  South_Europe:
    # Main territory target — used if no country-specific breakdown provided
    revenue_target:
      fy27: 3650000
      fy26: 4650000

    # Country-level targets (if defined, used instead of territory-wide)
