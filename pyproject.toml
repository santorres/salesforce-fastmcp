[project]
name = "salesforce-fastmcp"
version = "1.0.0"
description = "FastMCP server for Salesforce integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
salesforce-mcp = "mcp.server:main"
channel = "cli.channel_cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires a live MCP server (use -m integration to run, -m 'not integration' to skip)",
]
